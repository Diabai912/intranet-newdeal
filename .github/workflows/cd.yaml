name: CD Pipeline - Prod

on:
  push:
    branches: [prod]

env:
  IMAGE_NAME: intranet-newdeal
  IMAGE_TAG: 1.0.1
  DOCKER_REGISTRY: ${{ secrets.DOCKER_USERNAME }}

jobs:

  security-scan:
    name: Job 1 - Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: table
          exit-code: '1'
          severity: 'CRITICAL'

  deploy:
    name: Job 2 - Deploy on runner_prod
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull latest image
        run: docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Stop existing container
        run: docker stop intranet-app || true

      - name: Remove old container
        run: docker rm intranet-app || true

      - name: Run new container on port 80
        run: |
          docker run -d \
            -p 80:80 \
            --name intranet-app \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  notify:
    name: Notification Email
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CD Pipeline ${{ job.status }} - ${{ github.repository }}"
          to: moussawade@groupeisi.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Pipeline CD terminé avec le statut : ${{ job.status }}
            Branche : ${{ github.ref }}
            Commit : ${{ github.sha }}